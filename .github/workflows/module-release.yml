name: Foundry module

on:
  pull_request:
  push:
    branches: [main, release/v1]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag matching module version (e.g. v0.1.0)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub release with the validated assets"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m unittest test_build_module -v
      - name: Build and validate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python build_module.py --tag "$RELEASE_TAG"
          else
            python build_module.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: foundry-module
          path: |
            dist/module.json
            dist/dm-companion.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: foundry-module
          path: dist
      - name: Publish explicitly requested release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/module.json dist/dm-companion.zip \
            --verify-tag --title "DM Companion $RELEASE_TAG" --generate-notes
